repos:
  - repo: local
    hooks:
      - id: openapi-fresh
        name: OpenAPI freshness
        entry: python3 scripts/quality/check_openapi_fresh.py
        language: system
        pass_filenames: false
      - id: api-lint
        name: API linter
        entry: python3 scripts/quality/api_linter.py docs/openapi.json
        language: system
        pass_filenames: false
        files: ^docs/openapi\.json$
      - id: no-private-keys
        name: Block private key material
        entry: bash -c 'rg -n --hidden -g "!*.lock" -g "!.git/**" "BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY" && exit 1 || exit 0'
        language: system
        pass_filenames: false
