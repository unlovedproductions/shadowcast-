name: Quality Gates

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pip-audit

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.lock --progress-spinner off

      - name: Export and verify OpenAPI
        run: |
          python export_openapi.py -o ../docs/openapi.json
          git diff --exit-code ../docs/openapi.json

      - name: API linter
        run: python ../scripts/quality/api_linter.py ../docs/openapi.json --format json --output ../backend/eval/artifacts/ci_api_lint.json

      - name: Breaking change detection
        run: python ../scripts/quality/breaking_change_detector.py ../docs/openapi.baseline.json ../docs/openapi.json --format json --output ../backend/eval/artifacts/ci_breaking.json

      - name: API scorecard (min grade B)
        run: python ../scripts/quality/api_scorecard.py ../docs/openapi.json --format json --min-grade B --output ../backend/eval/artifacts/ci_scorecard.json

      - name: Prompt structural gate
        run: python eval/structural_gate.py

      - name: Pipeline orchestrator validate
        run: python eval/agent_orchestrator.py eval/shadowcast_pipeline.yaml --validate

      - name: Product RAG eval gate
        run: python eval/run_rag_eval.py --min-relevance 0.80

      - name: Corpus RAG eval gate
        run: python eval/run_corpus_rag_eval.py --min-precision 0.80

      - name: Pytest (unit + API routes)
        run: pytest ../tests/ -q -m "not llm"

      - name: Video claim audit (strict when fixtures exist)
        run: |
          if [ -d output ] && find output -name '*.mp4' | grep -q .; then
            python video_claim_audit.py --output-dir output --fail-on warn --require-videos
          else
            echo "No output MP4 fixtures — skipping strict audit"
          fi

      - name: Ship gate (app code)
        run: |
          mkdir -p eval/artifacts
          set -o pipefail
          python ../scripts/quality/ship_gate_scanner.py .. --json --no-interactive | tee eval/artifacts/ci_ship_gate.json

      - name: Commit message lint (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git log origin/${{ github.base_ref }}..HEAD --pretty=format:'%s' > /tmp/commits.txt
          python ../scripts/quality/commit_linter.py --input /tmp/commits.txt --strict --format text

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-artifacts
          path: |
            backend/eval/artifacts/ci_*.json
          if-no-files-found: ignore

  e2e-mocked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Playwright
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run mocked E2E
        run: npm run e2e
        env:
          CI: "true"
          INTERNAL_SERVICE_SECRET: ""
