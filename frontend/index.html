<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCast — by Unloved Productions</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0a; --bg2: #141414; --bg3: #1e1e1e; --bg4: #2a2a2a;
            --text: #e8e8e8; --text2: #aaa; --accent: #c4507a; --accent2: #d4698f;
            --green: #4caf50; --red: #f44336; --blue: #2196f3; --cyan: #c4507a;
            --purple: #9c27b0; --yellow: #d4698f; --radius: 10px;
            --pink: #c4507a; --pink-light: #d4698f; --pink-glow: rgba(196,80,122,.15);
        }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent2); }

        .header { background: linear-gradient(135deg, var(--bg2) 0%, #1a0a10 100%); border-bottom: 1px solid var(--pink); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .logo-placeholder { width: 40px; height: 40px; border-radius: 8px; border: 2px dashed var(--pink); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--pink); text-align: center; line-height: 1.1; }
        .logo-placeholder img { width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }
        .footer { background: var(--bg2); border-top: 1px solid var(--bg3); padding: 20px 24px; text-align: center; margin-top: 40px; }
        .footer .company { font-size: 13px; color: var(--pink); font-weight: 600; }
        .footer .motto { font-size: 11px; color: var(--text2); font-style: italic; margin-top: 4px; }
        .footer .tagline { font-size: 10px; color: var(--text2); opacity: .6; margin-top: 6px; }
        .header h1 { font-size: 20px; font-weight: 700; }
        .header h1 span { color: var(--pink); }
        .header h1 .edition { font-size: 11px; color: var(--pink-light); font-weight: 400; display: block; margin-top: 2px; }
        .header-right { display: flex; gap: 12px; align-items: center; }
        .settings-btn { background: var(--bg3); border: 1px solid var(--bg4); color: var(--text2); padding: 8px 16px; border-radius: var(--radius); cursor: pointer; font-size: 13px; transition: all .2s; }
        .settings-btn:hover { background: var(--bg4); color: var(--text); }
        .provider-badge { background: var(--bg3); padding: 4px 10px; border-radius: 20px; font-size: 12px; color: var(--cyan); }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        .card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .card h2 .num { background: var(--accent); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
        .card h2 .badge { font-size: 10px; background: var(--cyan); color: #000; padding: 2px 8px; border-radius: 10px; font-weight: 700; margin-left: 8px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-size: 13px; color: var(--text2); font-weight: 500; }
        label .req { color: var(--accent); }
        label .trust { color: var(--green); font-size: 10px; font-weight: 700; }
        input, textarea, select { background: var(--bg); border: 1px solid var(--bg4); color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border .2s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
        textarea { resize: vertical; min-height: 60px; }
        .hint { font-size: 11px; color: var(--text2); opacity: .7; }
        .hint-green { font-size: 11px; color: var(--green); opacity: .85; }

        .section-divider { border: none; border-top: 1px dashed var(--bg4); margin: 20px 0 16px; }
        .section-label { font-size: 12px; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

        .mode-tabs { display: flex; gap: 0; margin-bottom: 20px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--bg4); }
        .mode-tab { flex: 1; padding: 14px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 600; background: var(--bg2); color: var(--text2); transition: all .2s; border: none; }
        .mode-tab:hover { background: var(--bg3); }
        .mode-tab.active { background: var(--accent); color: #fff; }

        .upload-zone { border: 2px dashed var(--bg4); border-radius: var(--radius); padding: 40px; text-align: center; cursor: pointer; transition: all .2s; position: relative; }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--pink); background: var(--pink-glow); }
        .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-zone .icon { font-size: 40px; margin-bottom: 12px; }
        .upload-zone p { font-size: 14px; color: var(--text2); }
        .upload-zone .formats { font-size: 12px; color: var(--text2); opacity: .6; margin-top: 6px; }
        .upload-actions { display: flex; gap: 12px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }
        .upload-actions button { padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
        .btn-template { background: var(--blue); color: #fff; }
        .btn-gsheet { background: var(--green); color: #fff; }
        .btn-template:hover, .btn-gsheet:hover { opacity: .85; }
        .preview-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }
        .preview-table th { background: var(--bg3); color: var(--text2); padding: 8px 10px; text-align: left; font-weight: 600; }
        .preview-table td { padding: 8px 10px; border-bottom: 1px solid var(--bg3); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .preview-table tr:hover td { background: var(--bg3); }
        .product-count { display: inline-block; background: var(--accent); color: #fff; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-left: 8px; }

        .hook-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .hook-option { background: var(--bg); border: 2px solid var(--bg4); border-radius: var(--radius); padding: 14px; cursor: pointer; transition: all .2s; position: relative; }
        .hook-option:hover { border-color: var(--accent); }
        .hook-option.selected { border-color: var(--pink); background: var(--pink-glow); }
        .hook-option h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .hook-option p { font-size: 11px; color: var(--text2); line-height: 1.4; }
        .hook-option .adv-badge { position: absolute; top: 8px; right: 8px; font-size: 9px; background: var(--yellow); color: #000; padding: 1px 6px; border-radius: 8px; font-weight: 700; }
        .select-all-btn { background: none; border: 1px solid var(--bg4); color: var(--text2); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 10px; }
        .select-all-btn:hover { border-color: var(--accent); color: var(--accent); }

        .style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
        .style-option { background: var(--bg); border: 2px solid var(--bg4); border-radius: var(--radius); padding: 14px; cursor: pointer; transition: all .2s; }
        .style-option:hover { border-color: var(--pink); }
        .style-option.selected { border-color: var(--pink); background: var(--pink-glow); }
        .style-option h3 { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--pink); }
        .style-option p { font-size: 11px; color: var(--text2); line-height: 1.4; }

        .format-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .format-option { background: var(--bg); border: 2px solid var(--bg4); border-radius: var(--radius); padding: 16px; cursor: pointer; text-align: center; transition: all .2s; }
        .format-option:hover { border-color: var(--accent); }
        .format-option.selected { border-color: var(--pink); background: var(--pink-glow); }
        .format-option .icon { font-size: 28px; margin-bottom: 6px; }
        .format-option h3 { font-size: 13px; font-weight: 600; }
        .format-option p { font-size: 11px; color: var(--text2); }

        .btn-primary { background: var(--accent); color: #fff; border: none; padding: 14px 32px; border-radius: var(--radius); font-size: 16px; font-weight: 700; cursor: pointer; transition: all .2s; width: 100%; }
        .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; }
        .btn-download { background: var(--green); color: #fff; }
        .btn-copy { background: var(--blue); color: #fff; }
        .btn-copy:hover, .btn-download:hover { opacity: .85; }

        .progress-section { text-align: center; padding: 40px; }
        .progress-bar-bg { background: var(--bg); border-radius: 20px; height: 12px; overflow: hidden; margin: 20px 0; }
        .progress-bar { background: linear-gradient(90deg, var(--pink), var(--pink-light)); height: 100%; border-radius: 20px; transition: width .5s ease; }
        .progress-text { font-size: 14px; color: var(--text2); }
        .progress-pct { font-size: 36px; font-weight: 700; color: var(--pink); }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 3px solid var(--bg4); border-top-color: var(--pink); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .results-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: var(--bg); border: 1px solid var(--bg4); color: var(--text2); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .2s; }
        .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .tab-btn.product-tab.active { background: var(--purple); border-color: var(--purple); }
        .result-block { background: var(--bg); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
        .result-block h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--accent); }
        .result-block .content { font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .result-block .actions { display: flex; gap: 8px; margin-top: 10px; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { background: var(--bg3); padding: 3px 10px; border-radius: 20px; font-size: 11px; color: var(--text2); }
        .video-player { width: 100%; max-width: 480px; border-radius: var(--radius); background: #000; }
        .social-preview-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-top: 16px; }
        .social-preview-meta { flex: 1; min-width: 220px; font-size: 13px; color: var(--text2); }
        .social-preview-meta h3 { font-size: 15px; color: var(--text); margin-bottom: 8px; }
        .social-preview-thumb { width: 120px; border-radius: 8px; border: 1px solid var(--bg3); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal { background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px; padding: 28px; width: 90%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { font-size: 18px; margin-bottom: 20px; }
        .modal .form-group { margin-bottom: 14px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
        .modal-actions .save { background: var(--accent); color: #fff; }
        .modal-actions .cancel { background: var(--bg4); color: var(--text); }
        .model-rec { background: var(--bg); border: 1px solid var(--bg3); border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 11px; }
        .model-rec table { width: 100%; border-collapse: collapse; }
        .model-rec th { text-align: left; color: var(--text2); padding: 3px 6px; font-size: 10px; }
        .model-rec td { padding: 3px 6px; font-size: 11px; }
        .model-rec .pick { cursor: pointer; color: var(--cyan); text-decoration: underline; }

        .new-gen-btn { background: var(--bg3); border: 1px solid var(--bg4); color: var(--text); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
        .new-gen-btn:hover { background: var(--bg4); }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .format-grid { grid-template-columns: 1fr; }
            .hook-grid { grid-template-columns: 1fr 1fr; }
            .style-grid { grid-template-columns: 1fr 1fr; }
            .mode-tabs { flex-direction: column; }
        }

        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--green); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 200; animation: fadeInUp .3s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Navigation */
        .nav-bar { display: flex; gap: 0; border-bottom: 2px solid var(--bg3); margin-bottom: 24px; }
        .nav-item { padding: 12px 24px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .2s; }
        .nav-item:hover { color: var(--text); }
        .nav-item.active { color: var(--pink); border-bottom-color: var(--pink); }
        .nav-item .nav-badge { background: var(--pink); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }

        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 20px; text-align: center; }
        .stat-card .stat-value { font-size: 32px; font-weight: 700; color: var(--pink); }
        .stat-card .stat-label { font-size: 12px; color: var(--text2); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .stat-sub { font-size: 11px; color: var(--text2); margin-top: 6px; }
        .stat-card.green .stat-value { color: var(--green); }
        .stat-card.blue .stat-value { color: var(--blue); }
        .stat-card.purple .stat-value { color: var(--purple); }

        /* Performance Table */
        .perf-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .perf-table th { background: var(--bg3); color: var(--text2); padding: 10px 14px; text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
        .perf-table td { padding: 10px 14px; border-bottom: 1px solid var(--bg3); }
        .perf-table tr:hover td { background: var(--bg3); }
        .perf-bar { height: 8px; background: var(--bg4); border-radius: 4px; overflow: hidden; min-width: 80px; }
        .perf-bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--pink), var(--pink-light)); }

        /* Social Posting */
        .platform-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: var(--radius); padding: 20px; display: flex; align-items: center; gap: 16px; }
        .platform-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; }
        .platform-icon.ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; }
        .platform-icon.tt { background: #000; color: #fff; border: 1px solid #333; }
        .platform-info { flex: 1; }
        .platform-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .platform-info .status { font-size: 12px; }
        .status-configured { color: var(--green); }
        .status-not-configured { color: var(--red); }
        .platform-actions { display: flex; gap: 8px; }

        .queue-item { background: var(--bg); border: 1px solid var(--bg3); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; }
        .queue-item .qi-platform { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 4px; text-transform: uppercase; }
        .queue-item .qi-platform.ig { background: #dc2743; color: #fff; }
        .queue-item .qi-platform.tt { background: #000; color: #fff; }
        .queue-item .qi-info { flex: 1; }
        .queue-item .qi-info .qi-caption { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
        .queue-item .qi-info .qi-time { font-size: 11px; color: var(--text2); margin-top: 2px; }

        .empty-state { text-align: center; padding: 40px; color: var(--text2); }
        .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
        .empty-state p { font-size: 14px; }
        .empty-state .empty-hint { font-size: 12px; margin-top: 8px; opacity: .6; }

        .metric-input-row { display: flex; gap: 10px; align-items: end; margin-bottom: 12px; }
        .metric-input-row .form-group { flex: 1; margin-bottom: 0; }
        .metric-input-row button { height: 40px; white-space: nowrap; }

        /* Nav Buttons */
        .nav-btn { padding: 12px 24px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text2); background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .2s; display: flex; align-items: center; gap: 6px; }
        .nav-btn:hover { color: var(--text); }
        .nav-btn.active { color: var(--pink); border-bottom-color: var(--pink); }
        .nav-icon { font-size: 16px; }

        /* Stat Grid */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }

        /* Analytics Table */
        .analytics-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .analytics-table th { background: var(--bg3); color: var(--text2); padding: 10px 14px; text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
        .analytics-table td { padding: 10px 14px; border-bottom: 1px solid var(--bg3); }
        .analytics-table tr:hover td { background: rgba(196,80,122,.05); }

        /* Hook Badge */
        .hook-badge { background: var(--pink-glow); color: var(--pink); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
    const API = window.location.origin + '/api';

    let state = {
        page: 'form',
        mode: 'single',
        showSettings: false,
        llmProvider: 'openai', llmApiKey: '', llmBaseUrl: '', llmModel: '',
        providerPresets: {},
        // Single product — core
        productName: '', niche: '', keyFeatures: '', price: '',
        affiliateLink: '', keywords: '', targetAudience: '',
        productCategory: '', competitors: '', usp: '',
        discountInfo: '', couponCode: '',
        // Single product — trust-based
        commonComplaints: '', commonPraises: '', whoNotFor: '',
        seriesName: '', priceComparison: '',
        // Content style
        contentStyle: 'honest_review',
        contentStyleManuallyChanged: false,
        // Batch
        batchProducts: [],
        batchFileName: '',
        // Selections
        selectedHooks: ['curiosity'],
        selectedFormats: ['short_form', 'long_form'],
        audioMood: 'chill',
        audioEnabled: true,
        useTts: false,
        useTtsUserSet: false,
        ttsProvider: 'auto',
        ttsVoice: '',
        ttsProviders: null,
        videoPreset: 'medium',
        readiness: null,
        // Job
        jobId: null, jobMode: 'single', progress: 0, currentStep: '', jobStatus: '',
        results: null, batchResults: null, resultsSummary: null, resultsProductInfo: null, trustInputs: null,
        errors: [], scriptErrors: [], videoWarnings: [], otherErrors: [], jobWarnings: [],
        auditResult: null,
        // Results view
        activeTab: null, activeFormat: 'short_form', activeProductIdx: 0, activeBatchIdx: 0,
        // Navigation
        navPage: 'generate',
        // Analytics
        analyticsData: null, analyticsLoading: false, youtubeSyncLoading: false,
        trackVideoId: '', trackProduct: '', trackHook: '', trackFormat: '',
        metricVideoId: '', metricType: 'views', metricValue: '',
        // Social
        socialStatus: null, socialLoading: false,
        oauthStatus: null, oauthLoading: false, oauthConfig: null, oauthConnecting: null,
        postingQueue: [], queueLoading: false,
        postableJobs: [], postableJobsLoading: false,
        socialSelectedJobId: '', socialSelectedProductSlug: '', socialSelectedVariantKey: '',
        socialShowManualPath: false,
        socialPostPlatform: 'instagram', socialPostVideo: '', socialPostCaption: '', socialPostHashtags: '', socialPostSchedule: '',
        publishPlatforms: ['youtube', 'instagram', 'tiktok'],
        publishLoading: false, publishResults: null,
        rumbleUsername: '', rumblePassword: '',
    };

    const publishPlatformOptions = [
        { id: 'youtube', label: 'YouTube' },
        { id: 'instagram', label: 'Instagram Reels' },
        { id: 'facebook', label: 'Facebook Page' },
        { id: 'tiktok', label: 'TikTok' },
        { id: 'rumble', label: 'Rumble' },
    ];

    const hooks = [
        { id: 'curiosity', name: 'Curiosity', desc: 'Provocative questions, surprising reveals that make viewers click', adv: false },
        { id: 'problem_agitation', name: 'Problem-Agitation', desc: 'Pain point \u2192 agitate \u2192 tease the solution', adv: false },
        { id: 'listicle', name: 'Listicle', desc: 'Top X reasons / numbered format for easy consumption', adv: false },
        { id: 'urgency', name: 'Urgency', desc: 'FOMO, limited deals, time pressure to drive action', adv: false },
        { id: 'contrarian', name: 'Contrarian', desc: 'Challenge popular opinions, spark debate', adv: false },
        { id: 'data_bomb', name: 'Data Bomb', desc: 'Open with a surprising statistic for instant credibility', adv: true },
        { id: 'confession', name: 'Confession', desc: 'Admit a past mistake to build trust and curiosity', adv: true },
        { id: 'comparison_trap', name: 'Comparison Trap', desc: 'Price comparison that makes viewers feel smart', adv: true },
        { id: 'myth_buster', name: 'Myth Buster', desc: 'Challenge conventional wisdom to spark engagement', adv: true },
    ];

    // ── Render ───────────────────────────────────────────────
    function render() {
        const app = document.getElementById('app');
        let html = renderHeader() + '<div class="container">';
        html += renderNavBar();
        if (state.navPage === 'generate') {
            if (state.page === 'form') html += renderForm();
            else if (state.page === 'progress') html += renderProgress();
            else if (state.page === 'error') html += renderGenerationError();
            else html += renderResults();
        } else if (state.navPage === 'analytics') {
            html += renderAnalyticsPage();
        } else if (state.navPage === 'social') {
            html += renderSocialPage();
        }
        html += '</div>';
        html += renderFooter();
        if (state.showSettings) html += renderSettingsModal();
        app.innerHTML = html;
        attachEvents();
    }

    function renderHeader() {
        const pn = state.providerPresets[state.llmProvider]?.name || state.llmProvider;
        return `<div class="header">
            <div class="header-left">
                <div class="logo-placeholder"><img src="/assets/logo.png" onerror="this.style.display='none';this.parentElement.textContent='LOGO'"></div>
                <h1><span>Shadow</span>Cast<span class="edition">by Unloved Productions</span></h1>
            </div>
            <div class="header-right">
                <span class="provider-badge">${pn}</span>
                <button class="settings-btn" onclick="toggleSettings()">Settings</button>
            </div>
        </div>`;
    }

    function renderGenerationScopePreview() {
        const productCount = isBatchMode() ? Math.max(state.batchProducts.length, 1) : 1;
        const hookCount = Math.max(state.selectedHooks.length, 1);
        const formatCount = Math.max(state.selectedFormats.length, 1);
        const totalOutputs = productCount * hookCount * formatCount;
        const perOutputMinutes = state.useTts ? 1.8 : state.audioEnabled ? 1.5 : 1.2;
        const presetFactor = state.videoPreset === 'best' ? 1.35 : state.videoPreset === 'fast' ? 0.85 : 1;
        const etaMinutes = Math.max(1, Math.round(totalOutputs * perOutputMinutes * presetFactor));

        const hookNames = hooks
            .filter((h) => state.selectedHooks.includes(h.id))
            .map((h) => h.name);
        const formatNames = state.selectedFormats.map((f) => (f === "short_form" ? "Shorts" : "Long"));
        const hookPreview = hookNames.length > 2 ? `${hookNames.slice(0, 2).join(", ")} +${hookNames.length - 2}` : hookNames.join(", ");

        return `<p style="font-size:12px;color:var(--text2);margin-top:8px;">
            Scope: ${productCount} product${productCount === 1 ? "" : "s"} × ${hookCount} hook${hookCount === 1 ? "" : "s"} × ${formatCount} format${formatCount === 1 ? "" : "s"} = <strong>${totalOutputs}</strong> outputs (est. ~${etaMinutes} min).<br>
            Hooks: ${esc(hookPreview || "none")} • Formats: ${esc(formatNames.join(", ") || "none")}${!state.useTts && !state.audioEnabled ? '<br><span style="color:var(--accent);">Warning: no voiceover or background audio selected.</span>' : ''}
        </p>`;
    }

    function mapVideoPreset(uiPreset) {
        if (uiPreset === 'fast') return 'veryfast';
        if (uiPreset === 'best') return 'slow';
        return 'medium';
    }

    function renderReadinessBanner() {
        const r = state.readiness;
        if (!r) return '';
        let html = '';
        if (r.blockers && r.blockers.length) {
            html += `<div style="font-size:12px;color:var(--red);margin-top:8px;border:1px solid var(--red);border-radius:8px;padding:10px;">
                <strong>Preflight blocked:</strong><br>${r.blockers.map((b) => esc(b)).join('<br>')}
            </div>`;
        } else if (r.ready) {
            html += `<p style="font-size:12px;color:#6f6;margin-top:8px;">Preflight OK — LLM, ffmpeg, and TTS checks passed.</p>`;
        }
        if (r.warnings && r.warnings.length) {
            html += `<p style="font-size:12px;color:var(--accent);margin-top:8px;">${r.warnings.map((w) => esc(w)).join(' ')}</p>`;
        }
        return html;
    }

    function renderForm() {
        return `
        <div class="mode-tabs">
            <button class="mode-tab ${state.mode==='single'?'active':''} " onclick="setMode('single')">Single Product</button>
            <button class="mode-tab ${state.mode==='batch'?'active':''} " onclick="setMode('batch')">Batch Upload (CSV)</button>

        </div>
        ${state.mode === 'single' ? renderSingleForm() : state.mode === 'batch' ? renderBatchForm() : renderImportAPFForm()}

        <button class="btn-primary" onclick="startGeneration()">

        </button>

        return `<div class="card">
            <h2><span class="num">3</span> Hook Types</h2>
            <button class="select-all-btn" onclick="toggleAllHooks()">${state.selectedHooks.length===hooks.length?'Deselect All':'Select All ('+hooks.length+' hooks)'}</button>
            <div class="hook-grid">
                ${hooks.map(h=>`<div class="hook-option ${state.selectedHooks.includes(h.id)?'selected':''}" onclick="toggleHook('${h.id}')">

            <h2><span class="num">4</span> Video Formats</h2>
            <div class="format-grid">
                <div class="format-option ${state.selectedFormats.length===1&&state.selectedFormats[0]==='short_form'?'selected':''}" onclick="setFormats(['short_form'])">

                </select>
            </div>
            ${state.audioEnabled ? `
            <div class="format-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px;">
                <div class="format-option ${state.audioMood==='chill'?'selected':''}" onclick="state.audioMood='chill';render()">
                    <div class="icon">🎵</div><h3>Chill</h3><p>Lo-fi ambient, relaxed</p>
                </div>
                <div class="format-option ${state.audioMood==='energetic'?'selected':''}" onclick="state.audioMood='energetic';render()">
                    <div class="icon">⚡</div><h3>Energetic</h3><p>Upbeat, fast-paced</p>
                </div>
                <div class="format-option ${state.audioMood==='dramatic'?'selected':''}" onclick="state.audioMood='dramatic';render()">
                    <div class="icon">🎭</div><h3>Dramatic</h3><p>Tension, reveals</p>
                </div>
                <div class="format-option ${state.audioMood==='minimal'?'selected':''}" onclick="state.audioMood='minimal';render()">
                    <div class="icon">🔇</div><h3>Minimal</h3><p>Subtle, barely there</p>
                </div>
            </div>` : ''}
            ${state.useTts ? `
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
                <div class="form-group" style="min-width:180px;flex:1;">
                    <label>TTS Provider</label>
                    <select class="input-field" onchange="state.ttsProvider=this.value;state.ttsVoice='';render()">
                        <option value="auto" ${state.ttsProvider==='auto'?'selected':''}>Auto (best available)</option>
                        ${ttsProviderOptions()}
                    </select>
                </div>
                <div class="form-group" style="min-width:180px;flex:1;">
                    <label>Voice</label>
                    <select class="input-field" onchange="state.ttsVoice=this.value">
                        <option value="">Default</option>
                        ${ttsVoiceOptions()}
                    </select>
                </div>
            </div>` : ''}
        </div>`;
    }

    function ttsProviderOptions() {
        const providers = (state.ttsProviders && state.ttsProviders.providers) || {};
        return Object.entries(providers).map(([key, info]) => {
            const avail = info.available ? '' : ' (not installed)';
            return `<option value="${key}" ${state.ttsProvider===key?'selected':''} ${info.available?'':'disabled'}>${esc(info.name)}${avail}</option>`;
        }).join('');
    }

    function ttsVoiceOptions() {
        const providers = (state.ttsProviders && state.ttsProviders.providers) || {};
        const key = state.ttsProvider === 'auto'
            ? (state.ttsProviders && state.ttsProviders.best) || 'gtts'
            : state.ttsProvider;
        const voices = (providers[key] && providers[key].voices) || [];
        return voices.map(v => `<option value="${esc(v)}" ${state.ttsVoice===v?'selected':''}>${esc(v)}</option>`).join('');
    }

    async function loadTtsProviders(force=false) {
        if (state.ttsProviders && !force) {
            applySmartTtsDefault();
            return;
        }
        try {
            const res = await fetch(`${API}/tts-providers`);
            state.ttsProviders = await res.json();
            if (!state.ttsProvider || state.ttsProvider === 'auto') {
                state.ttsProvider = 'auto';
            }
            applySmartTtsDefault();
            render();
        } catch (e) {
            console.warn('TTS providers unavailable', e);
        }
    }

    function applySmartTtsDefault() {
        if (state.useTtsUserSet || !state.ttsProviders) return;
        const best = state.ttsProviders.best || 'gtts';
        if (['kokoro', 'openai', 'piper'].includes(best)) {
            state.useTts = true;
        }
    }

    async function loadReadiness() {
        try {
            const res = await fetch(`${API}/readiness`);
            state.readiness = await res.json();
        } catch (e) {
            state.readiness = {
                ready: false,
                blockers: ['Could not reach backend readiness check.'],
                warnings: [],
            };
        }
    }

    async function ensurePreflight() {
        await loadReadiness();
        const r = state.readiness || {};
        if (r.blockers && r.blockers.length) {
            showToast('Fix preflight blockers before generating.');
            render();
            return false;
        }
        if (!state.useTts && !state.audioEnabled) {
            showToast('Enable voiceover or background audio — silent videos underperform.');
            return false;
        }
        return true;
    }

    function getErrorRecoveryHints(phase) {
        const hints = [];
        if (phase === 'Script' || phase === 'Starting') {
            hints.push('Confirm Ollama/LM Studio is running and the configured model is loaded.');
            hints.push('Delete cached *_scripts.json for this product if a bad script keeps replaying.');
        }
        if (phase === 'Render') {
            hints.push('Verify ffmpeg is installed (`ffmpeg -version`).');
            hints.push('Try Export Quality = Fast if renders time out on long batches.');
        }
        if (phase === 'Package') {
            hints.push('YouTube package generation uses the same LLM — recheck provider/model in Settings.');
        }
        hints.push('Use Retry Status if the server restarted mid-run; completed artifacts are skipped on rerun.');
        return hints;
    }

    function splitJobMessages(messages) {
        const scriptErrors = [];
        const videoWarnings = [];
        const otherErrors = [];
        (messages || []).forEach((msg) => {
            const text = String(msg || '');
            if (!text) return;
            if (
                text.includes('] Script (') ||
                text.includes('No segments found in script') ||
                text.includes('Generated scripts invalid')
            ) {
                scriptErrors.push(text);
                return;
            }
            if (text.includes('] Video (')) {
                videoWarnings.push(text);
                return;
            }
            otherErrors.push(text);
        });
        return { scriptErrors, videoWarnings, otherErrors };
    }

    function renderProgress() {
        const pct = Number.isFinite(state.progress) ? state.progress : 0;
        const phase = getProgressPhase(state.currentStep, state.jobStatus);
        const scriptIssueBlock = state.scriptErrors.length
            ? `<div style="color:var(--red);margin-top:12px;font-size:13px;">
                <strong>Script Errors:</strong>
                ${state.scriptErrors.map(err => `<div style="margin-top:6px;">• ${esc(err)}</div>`).join('')}
                <div style="margin-top:8px;color:var(--text2);">If this came from cached output, delete the cached <code>*_curiosity_scripts.json</code> for this job and rerun.</div>
              </div>`
            : '';
        const warningRows = [...state.videoWarnings, ...state.otherErrors];
        const warningBlock = warningRows.length
            ? `<div style="color:var(--red);margin-top:12px;font-size:13px;">
                <strong>Warnings:</strong>
                ${warningRows.map(err => `<div style="margin-top:6px;">• ${esc(err)}</div>`).join('')}
              </div>`
            : '';
        return `<div class="progress-section card">
            <div class="spinner"></div>
            <div class="progress-pct">${pct}%</div>
            <div class="progress-bar-bg"><div class="progress-bar" style="width:${pct}%"></div></div>
            <div style="font-size:12px;color:var(--text2);margin-bottom:8px;">Phase: <strong style="color:var(--pink);">${esc(phase)}</strong></div>
            ${renderProgressPhaseTrail(phase)}
            <div class="progress-text">${esc(state.currentStep)}</div>
            ${scriptIssueBlock}
            ${warningBlock}
        </div>`;
    }

    function getProgressPhase(step, status='') {
        if ((status || '').toLowerCase() === 'error') return 'Error';
        const s = String(step || '').toLowerCase();
        if (s.includes('starting batch') || s.includes('starting...')) return 'Starting';
        if (s.includes('cached') || s.includes('using cached')) {
            if (s.includes('script')) return 'Script';
            if (s.includes('youtube') || s.includes('package')) return 'Package';
            if (s.includes('video')) return 'Render';
            if (s.includes('thumbnail')) return 'Finalize';
        }
        if (s.includes('script')) return 'Script';
        if (s.includes('render') || s.includes('video')) return 'Render';
        if (s.includes('youtube package') || s.includes('yt assets') || s.includes('package')) return 'Package';
        if (s.includes('thumbnail') || s.includes('done') || s.includes('final')) return 'Finalize';
        return 'Starting';
    }

    function renderProgressPhaseTrail(activePhase) {
        const phases = ['Script', 'Render', 'Package', 'Finalize'];
        return `<div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
            ${phases.map((phase) => {
                const isActive = phase === activePhase;
                const style = isActive
                    ? 'background:rgba(255,45,149,.18);border-color:var(--pink);color:var(--pink);'
                    : 'background:var(--bg);border-color:#2a2a2a;color:var(--text2);';
                return `<span style="font-size:11px;padding:4px 9px;border:1px solid;border-radius:999px;${style}">${phase}</span>`;
            }).join('')}
        </div>`;
    }

    function renderGenerationError() {
        const phase = getProgressPhase(state.currentStep, 'error');
        const details = [...state.scriptErrors, ...state.videoWarnings, ...state.otherErrors];
        const detailBlock = details.length
            ? details.map((err) => `<div style="margin-top:6px;">• ${esc(err)}</div>`).join('')
            : '<div style="margin-top:6px;">No additional details provided.</div>';
        const recoveryHints = getErrorRecoveryHints(phase)
            .map((hint) => `<div style="margin-top:6px;">• ${esc(hint)}</div>`)
            .join('');
        return `<div class="card" style="border-color:var(--red);">
            <h2 style="color:var(--red);justify-content:center;">Generation Stopped</h2>
            <p style="color:var(--text2);font-size:14px;text-align:center;">The run hit an issue during <strong>${esc(phase)}</strong>.</p>
            <div style="background:var(--bg);border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin-top:10px;font-size:13px;color:var(--text2);">

                ${detailBlock}
            </div>
            <div style="background:var(--bg);border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin-top:10px;font-size:13px;color:var(--text2);">

                <button class="btn-primary" onclick="retryStatusPoll()">Retry Status</button>
                <button class="settings-btn" onclick="resetToForm()">Back to Generator</button>
            </div>
        </div>`;
    }

    function buildPostingKit(ytAssets, affiliateLink) {
        const parts = [];

        if (ytAssets.pinned_comment) parts.push(`\nPINNED COMMENT:\n${ytAssets.pinned_comment}`);
        if (ytAssets.seo_description) parts.push(`\nDESCRIPTION:\n${ytAssets.seo_description}`);
        if ((ytAssets.hashtags || []).length) parts.push(`\nHASHTAGS:\n${ytAssets.hashtags.join(' ')}`);
        if (affiliateLink) parts.push(`\nAFFILIATE LINK:\n${affiliateLink}`);
        return parts.join('\n').trim();
    }

    function renderDashboardData() {
        const d = state.analyticsData;
        if (!d) return '';
        const s = d.summary || {};
        let html = '';

        // Summary cards
        html += `<div class="card">
            <h2>Overview</h2>
            <div class="stat-grid">
                <div class="stat-card"><div class="stat-value">${s.total_videos||0}</div><div class="stat-label">Videos Tracked</div></div>
                <div class="stat-card"><div class="stat-value">${(s.total_views||0).toLocaleString()}</div><div class="stat-label">Total Views</div></div>
                <div class="stat-card"><div class="stat-value">${(s.total_revenue||0).toLocaleString('en-US',{style:'currency',currency:'USD'})}</div><div class="stat-label">Total Revenue</div></div>
                <div class="stat-card"><div class="stat-value">${(s.total_affiliate_clicks||0).toLocaleString()}</div><div class="stat-label">Affiliate Clicks</div></div>
                <div class="stat-card"><div class="stat-value">${(s.avg_ctr||0).toFixed(1)}%</div><div class="stat-label">Avg CTR</div></div>
                <div class="stat-card"><div class="stat-value">${(s.avg_conversion_rate||0).toFixed(2)}%</div><div class="stat-label">Avg Conversion</div></div>
            </div>
        </div>`;

        // Hook performance
        const hp = d.hook_performance || [];
        if (hp.length) {
            html += `<div class="card">
                <h2>Hook Performance Comparison</h2>
                <div style="overflow-x:auto;"><table class="analytics-table">
                    <tr><th>Hook Type</th><th>Videos</th><th>Avg Views</th><th>Avg CTR</th><th>Avg Revenue</th><th>Avg Conversion</th></tr>
                    ${hp.map(h=>`<tr>
                        <td><span class="hook-badge">${esc(h.hook||h.hook_type||'')}</span></td>
                        <td>${h.count||h.video_count||0}</td>
                        <td>${(h.avg_views||0).toLocaleString()}</td>
                        <td>${(h.avg_ctr||0).toFixed(1)}%</td>
                        <td>${(h.avg_revenue||0).toLocaleString('en-US',{style:'currency',currency:'USD'})}</td>
                        <td>${(h.avg_conversion||h.avg_conversion_rate||0).toFixed(2)}%</td>
                    </tr>`).join('')}
                </table></div>
            </div>`;
        }

        // Format performance
        const fp = d.format_performance || [];
        if (fp.length) {
            html += `<div class="card">
                <h2>Format Performance (Short vs Long)</h2>
                <div style="overflow-x:auto;"><table class="analytics-table">
                    <tr><th>Format</th><th>Videos</th><th>Avg Views</th><th>Avg CTR</th><th>Avg Revenue</th></tr>
                    ${fp.map(f=>`<tr>
                        <td>${esc(f.format||'')}</td>
                        <td>${f.count||f.video_count||0}</td>
                        <td>${(f.avg_views||0).toLocaleString()}</td>
                        <td>${(f.avg_ctr||0).toFixed(1)}%</td>
                        <td>${(f.avg_revenue||0).toLocaleString('en-US',{style:'currency',currency:'USD'})}</td>
                    </tr>`).join('')}
                </table></div>
            </div>`;
        }

        // Top revenue videos
        const tr = d.top_revenue_videos || [];
        if (tr.length) {
            html += `<div class="card">
                <h2>💰 Top Revenue Videos</h2>
                <div style="overflow-x:auto;"><table class="analytics-table">
                    <tr><th>#</th><th>Video</th><th>Product</th><th>Hook</th><th>Revenue</th><th>Views</th></tr>
                    ${tr.map((v,i)=>`<tr>
                        <td>${i+1}</td>
                        <td>${esc(v.video_id||'')}</td>
                        <td>${esc(v.product||'')}</td>
                        <td><span class="hook-badge">${esc(v.hook||'')}</span></td>
                        <td style="color:var(--green);font-weight:700;">${(v.total_revenue||v.revenue||0).toLocaleString('en-US',{style:'currency',currency:'USD'})}</td>
                        <td>${(v.total_views||v.views||0).toLocaleString()}</td>
                    </tr>`).join('')}
                </table></div>
            </div>`;
        }

        // Top conversion videos
        const tc = d.top_conversion_videos || [];
        if (tc.length) {
            html += `<div class="card">
                <h2>🎯 Top Converting Videos</h2>
                <div style="overflow-x:auto;"><table class="analytics-table">
                    <tr><th>#</th><th>Video</th><th>Product</th><th>Hook</th><th>Conversion Rate</th><th>Clicks</th></tr>
                    ${tc.map((v,i)=>`<tr>
                        <td>${i+1}</td>
                        <td>${esc(v.video_id||'')}</td>
                        <td>${esc(v.product||'')}</td>
                        <td><span class="hook-badge">${esc(v.hook||'')}</span></td>
                        <td style="color:var(--pink);font-weight:700;">${(v.conversion_rate||0).toFixed(2)}%</td>
                        <td>${(v.total_affiliate_clicks||v.clicks||0).toLocaleString()}</td>
                    </tr>`).join('')}
                </table></div>
            </div>`;
        }

        return html;
    }

    function renderSocialPage() {
        const cfg = state.oauthConfig || {};
        const ytConnecting = state.oauthConnecting === 'youtube';
        const metaConnecting = state.oauthConnecting === 'meta';
        const tiktokConnecting = state.oauthConnecting === 'tiktok';
        const configWarnings = [];
        if (state.oauthConfig) {
            if (!cfg.youtube) configWarnings.push('YouTube OAuth not configured. Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in backend/.env, then restart the server.');
            if (!cfg.meta) configWarnings.push('Meta OAuth not configured. Set META_APP_ID and META_APP_SECRET in backend/.env, then restart the server.');
            if (!cfg.tiktok) configWarnings.push('TikTok OAuth not configured. Set TIKTOK_CLIENT_KEY and TIKTOK_CLIENT_SECRET in backend/.env, then restart the server.');
        }
        return `
        <div class="card">
            <h2>Connect Accounts</h2>
            <p style="font-size:13px;color:var(--text2);margin-bottom:16px;">Connect platforms via OAuth before publishing. Rumble uses browser login.</p>
            ${configWarnings.length ? `<div style="margin-bottom:16px;padding:12px;border-radius:8px;background:rgba(255,180,0,0.1);border:1px solid var(--pink);font-size:13px;color:var(--text2);">${configWarnings.map(m=>`<div style="margin-bottom:6px;">${esc(m)}</div>`).join('')}</div>` : ''}
            <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
                <button class="btn-primary" onclick="loadOAuthStatus()" ${state.oauthLoading?'disabled':''}>${state.oauthLoading?'Loading...':'Refresh Status'}</button>
                <button class="btn-sm btn-template" onclick="connectOAuth('youtube')" ${ytConnecting?'disabled':''}>${ytConnecting?'Connecting...':'Connect YouTube'}</button>
                <button class="btn-sm btn-template" onclick="connectOAuth('meta')" ${metaConnecting?'disabled':''}>${metaConnecting?'Connecting...':'Connect Meta (IG+FB)'}</button>
                <button class="btn-sm btn-template" onclick="connectOAuth('tiktok')" ${tiktokConnecting?'disabled':''}>${tiktokConnecting?'Connecting...':'Connect TikTok'}</button>
            </div>
            ${state.oauthStatus ? renderOAuthStatus() : ''}
            <div class="form-grid" style="margin-top:16px;">
                <div class="form-group"><label>Rumble Username</label><input id="rumbleUser" value="${esc(state.rumbleUsername)}" placeholder="Rumble email/username"></div>
                <div class="form-group"><label>Rumble Password</label><input id="rumblePass" type="password" value="${esc(state.rumblePassword)}" placeholder="Rumble password"></div>
            </div>
            <button class="btn-sm btn-template" style="margin-top:10px;" onclick="connectRumble()">Connect Rumble</button>
        </div>

        <div class="card">
            <h2>Social Media Posting</h2>
            <p style="font-size:13px;color:var(--text2);margin-bottom:16px;">Post from a completed job (recommended) or use manual paths.</p>
            <div style="display:flex;gap:10px;margin-bottom:20px;">
                <button class="btn-primary" onclick="loadSocialStatus()" ${state.socialLoading?'disabled':''}>${state.socialLoading?'Loading...':'Check Platform Status'}</button>
                <button class="btn-sm btn-template" onclick="loadPostingQueue()">View Queue</button>
            </div>
        </div>

        ${state.socialStatus ? renderSocialStatus() : ''}

        ${renderSocialPostCard()}

        ${state.postingQueue.length ? renderPostingQueue() : ''}
        `;
    }

    function socialVariantKey(v) {
        return `${v.hook_type}|${v.video_format}|${v.product_slug || ''}`;
    }

    function getSocialSelectedJob() {
        return state.postableJobs.find(j => j.job_id === state.socialSelectedJobId) || null;
    }

    function getSocialFilteredVariants() {
        const job = getSocialSelectedJob();
        if (!job) return [];
        if (job.mode === 'batch' && state.socialSelectedProductSlug) {
            return (job.variants || []).filter(v => v.product_slug === state.socialSelectedProductSlug);
        }
        return job.variants || [];
    }

    function getSocialSelectedVariant() {
        const variants = getSocialFilteredVariants();
        return variants.find(v => socialVariantKey(v) === state.socialSelectedVariantKey) || variants[0] || null;
    }

    function applySocialVariantSelection() {
        const job = getSocialSelectedJob();
        const variant = getSocialSelectedVariant();
        if (!job || !variant) {
            state.socialPostCaption = '';
            state.socialPostHashtags = '';
            return;
        }
        state.jobId = job.job_id;
        state.activeTab = variant.hook_type;
        state.activeFormat = variant.video_format;
        state.socialPostCaption = variant.caption_hint || '';
        state.socialPostHashtags = (variant.hashtags || []).join(' ');
        if (!state.socialSelectedVariantKey) {
            state.socialSelectedVariantKey = socialVariantKey(variant);
        }
    }

    function onSocialJobSelect(jobId) {
        state.socialSelectedJobId = jobId;
        const job = getSocialSelectedJob();
        if (job?.mode === 'batch' && job.batch_products?.length) {
            state.socialSelectedProductSlug = job.batch_products[0].slug;
        } else {
            state.socialSelectedProductSlug = '';
        }
        const variants = getSocialFilteredVariants();
        state.socialSelectedVariantKey = variants[0] ? socialVariantKey(variants[0]) : '';
        applySocialVariantSelection();
        render();
    }

    function onSocialProductSelect(slug) {
        state.socialSelectedProductSlug = slug;
        const variants = getSocialFilteredVariants();
        state.socialSelectedVariantKey = variants[0] ? socialVariantKey(variants[0]) : '';
        applySocialVariantSelection();
        render();
    }

    function onSocialVariantSelect(key) {
        state.socialSelectedVariantKey = key;
        applySocialVariantSelection();
        render();
    }

    function renderSocialPostCard() {
        const job = getSocialSelectedJob();
        const variant = getSocialSelectedVariant();
        const variants = getSocialFilteredVariants();
        const canPost = !!(variant && (variant.video_file || state.socialPostVideo));
        const previewUrl = variant
            ? `${API}/download/${job.job_id}/${variant.path_prefix || ''}${variant.video_file}`
            : '';
        const thumbUrl = variant?.thumbnail_file
            ? `${API}/download/${job.job_id}/${variant.path_prefix || ''}${variant.thumbnail_file}`
            : '';

        let jobOptions = '<option value="">Select a completed job...</option>';
        for (const j of state.postableJobs) {
            const label = `${(j.product_name || j.job_id).slice(0, 45)} (${j.job_id.slice(0, 8)})`;
            jobOptions += `<option value="${esc(j.job_id)}" ${state.socialSelectedJobId === j.job_id ? 'selected' : ''}>${esc(label)}</option>`;
        }

        let productSelect = '';
        if (job?.mode === 'batch' && job.batch_products?.length) {
            productSelect = `<div class="form-group"><label>Product</label>
                <select onchange="onSocialProductSelect(this.value)">
                    ${job.batch_products.map(p => `<option value="${esc(p.slug)}" ${state.socialSelectedProductSlug === p.slug ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
                </select></div>`;
        }

        let variantOptions = variants.length
            ? variants.map(v => `<option value="${esc(socialVariantKey(v))}" ${state.socialSelectedVariantKey === socialVariantKey(v) ? 'selected' : ''}>${esc(v.label)}</option>`).join('')
            : '<option value="">No videos available</option>';

        const emptyHint = state.postableJobsLoading
            ? '<p style="color:var(--text2);font-size:13px;">Loading completed jobs...</p>'
            : !state.postableJobs.length
                ? '<p style="color:var(--text2);font-size:13px;">No completed jobs with videos yet. Generate a video first, then return here to post.</p>'
                : '';

        return `<div class="card">
            <h2>Post a Video</h2>
            <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">Choose a completed job, preview the video, then post.</p>
            ${emptyHint}
            <div class="form-grid">
                <div class="form-group"><label>Platform</label>
                    <select id="socialPlatform" onchange="state.socialPostPlatform=this.value">
                        ${publishPlatformOptions.map(p=>`<option value="${p.id}" ${state.socialPostPlatform===p.id?'selected':''}>${p.label}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group"><label>Completed Job</label>
                    <select id="socialJobSelect" onchange="onSocialJobSelect(this.value)" ${state.postableJobsLoading ? 'disabled' : ''}>
                        ${jobOptions}
                    </select>
                </div>
                ${productSelect}
                <div class="form-group"><label>Video</label>
                    <select id="socialVariantSelect" onchange="onSocialVariantSelect(this.value)" ${!variants.length ? 'disabled' : ''}>
                        ${variantOptions}
                    </select>
                </div>
                <div class="form-group full"><label>Caption</label><textarea id="socialCaption" placeholder="Auto-filled from posting package">${esc(state.socialPostCaption)}</textarea></div>
                <div class="form-group"><label>Hashtags</label><input id="socialHashtags" value="${esc(state.socialPostHashtags)}" placeholder="#affiliate #review"></div>
                <div class="form-group"><label>Schedule (optional)</label><input id="socialSchedule" type="datetime-local" value="${esc(state.socialPostSchedule)}"></div>
            </div>
            <input type="hidden" id="socialJobId" value="${esc(state.socialSelectedJobId || state.jobId || '')}">
            <input type="hidden" id="socialHook" value="${esc(variant?.hook_type || state.activeTab || 'curiosity')}">
            <input type="hidden" id="socialFormat" value="${esc(variant?.video_format || state.activeFormat || 'short_form')}">
            <details style="margin-top:12px;" ${state.socialShowManualPath ? 'open' : ''} ontoggle="state.socialShowManualPath=this.open">
                <summary style="cursor:pointer;font-size:13px;color:var(--text2);">Advanced: manual video path</summary>
                <div class="form-group" style="margin-top:10px;"><label>Video File Path</label><input id="socialVideo" value="${esc(state.socialPostVideo)}" placeholder="Path to video file"></div>
            </details>
            ${variant && previewUrl ? `<div class="card" style="margin-top:16px;background:var(--bg);">
                <h2>Video Preview</h2>
                <div class="social-preview-row">
                    <video class="video-player" controls src="${previewUrl}"></video>
                    <div class="social-preview-meta">
                        <h3>${esc(variant.seo_title || variant.label)}</h3>
                        <div>Job: <code>${esc(job.job_id)}</code></div>
                        <div>Style: ${esc(job.content_style || '—')}</div>
                        <div>Hook: ${esc(variant.hook_type)} · ${esc(variant.video_format === 'short_form' ? 'Short-Form' : 'Long-Form')}</div>
                        ${thumbUrl ? `<img class="social-preview-thumb" src="${thumbUrl}" alt="Thumbnail preview" style="margin-top:10px;">` : ''}
                    </div>
                </div>
            </div>` : ''}
            <div style="display:flex;gap:10px;margin-top:12px;">
                <button class="btn-primary" onclick="postToSocial(false)" ${!canPost ? 'disabled' : ''}>Post Now</button>
                <button class="btn-sm btn-template" onclick="postToSocial(true)" ${!canPost ? 'disabled' : ''}>Schedule Post</button>
                <button class="btn-sm" onclick="postToSocial(false, true)" style="background:var(--bg3);color:var(--text2);" ${!canPost ? 'disabled' : ''}>Dry Run</button>
                <button class="btn-sm" onclick="loadPostableJobs()" ${state.postableJobsLoading ? 'disabled' : ''}>Refresh Jobs</button>
            </div>
        </div>`;
    }

    function renderOAuthStatus() {
        const s = state.oauthStatus || {};
        const rows = publishPlatformOptions.map(p => {
            const st = s[p.id] || {};
            const connected = st.connected;
            return `<div class="stat-card"><div class="stat-label">${p.label}</div><div class="stat-value" style="font-size:14px;color:${connected?'var(--green)':'var(--red)'}">${connected?'Connected':'Not Connected'}</div></div>`;
        }).join('');
        return `<div class="card"><h2>OAuth Status</h2><div class="stat-grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr));">${rows}</div></div>`;
    }

    function renderSocialStatus() {
        const s = state.socialStatus;
        if (!s) return '';
        const platforms = publishPlatformOptions.map(p => p.id);
        return `<div class="card">
            <h2>Platform Status</h2>
            <div class="stat-grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr));">
                ${platforms.map(p=>`<div class="stat-card">
                    <div class="stat-label">${p}</div>
                    <div class="stat-value" style="font-size:14px;color:${(s[p]==='Connected'||s[p]==='Configured')?'var(--green)':'var(--red)'}">${esc(s[p]||'Unknown')}</div>
                </div>`).join('')}
            </div>
        </div>`;
    }

    function renderPostingQueue() {
        return `<div class="card">
            <h2>📋 Posting Queue (${state.postingQueue.length} items)</h2>
            <div style="overflow-x:auto;"><table class="analytics-table">
                <tr><th>#</th><th>Platform</th><th>Video</th><th>Scheduled</th><th>Status</th></tr>
                ${state.postingQueue.map((p,i)=>`<tr>
                    <td>${i+1}</td>
                    <td>${esc(p.platform||'')}</td>
                    <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;">${esc(p.video_path||'')}</td>
                    <td>${p.scheduled_time?new Date(p.scheduled_time).toLocaleString():'Immediate'}</td>
                    <td style="color:${p.posted?'var(--green)':'var(--pink)'}">${p.posted?'Posted':'Pending'}</td>
                </tr>`).join('')}
            </table></div>
            <button class="btn-primary" onclick="processQueue()" style="margin-top:12px;">Process Queue Now</button>
        </div>`;
    }

    function renderFooter() {
        return `<div class="footer">
            <div class="company">Unloved Productions</div>
            <div class="motto">Forged in Passion</div>
            <div class="tagline">Creating software for the problems you didn't know you had</div>
        </div>`;

    async function scrapeAmazon() {
        const url = document.getElementById('amazonUrl')?.value?.trim();
        if (!url) { showToast('Please paste an Amazon product URL'); return; }
        const btn = document.getElementById('scrapeBtn');
        const status = document.getElementById('scrapeStatus');
        btn.disabled = true; btn.textContent = 'Scraping...';
        status.style.display = 'block'; status.style.color = 'var(--pink)';
        status.textContent = 'Fetching product data from Amazon...';
        try {
            const form = new FormData(); form.append('url', url);
            const res = await fetch('/api/scrape-amazon', { method: 'POST', body: form });
            if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Scrape failed'); }
            const data = await res.json();
            const d = data.data;
            if (d.product_name) { state.productName = d.product_name; const el = document.getElementById('productName'); if(el) el.value = d.product_name; }
            if (d.price) { state.price = d.price; const el = document.getElementById('price'); if(el) el.value = d.price; }
            if (d.key_features) { state.keyFeatures = d.key_features; const el = document.getElementById('keyFeatures'); if(el) el.value = d.key_features; }
            if (d.common_complaints) { state.commonComplaints = d.common_complaints; const el = document.getElementById('commonComplaints'); if(el) el.value = d.common_complaints; }
            if (d.common_praises) { state.commonPraises = d.common_praises; const el = document.getElementById('commonPraises'); if(el) el.value = d.common_praises; }
            let extra = '';
            if (d.star_rating) extra += `Rating: ${d.star_rating}/5 | `;
            if (d.number_of_reviews) extra += `${d.number_of_reviews} reviews | `;
            status.style.color = 'var(--green)';
            status.textContent = `Auto-filled! ${extra}${d.common_complaints ? 'Complaints found' : 'No complaints found'} | ${d.common_praises ? 'Praises found' : 'No praises found'}`;
            showToast('Product data auto-filled from Amazon!');
        } catch (e) {
            status.style.color = 'var(--red)';
            status.textContent = `Error: ${e.message}. You can still fill in fields manually.`;
            showToast('Amazon scrape failed — fill in fields manually');
        } finally {
            btn.disabled = false; btn.textContent = 'Auto-Fill';
        }
    }

    async function researchKeywords() {
        const productName = document.getElementById('productName')?.value?.trim();
        const niche = document.getElementById('niche')?.value?.trim();
        const query = productName || niche || '';
        if (!query) { showToast('Enter a product name or niche first'); return; }
        const btn = document.getElementById('researchBtn');
        const results = document.getElementById('keywordResults');
        btn.disabled = true; btn.textContent = 'Researching...';
        results.style.display = 'block';
        results.innerHTML = '<p style="color:var(--pink);font-size:13px;">Fetching YouTube keyword data... (this takes ~30 seconds)</p>';
        try {
            const form = new FormData(); form.append('query', query);
            const res = await fetch('/api/youtube-research', { method: 'POST', body: form });
            if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Research failed'); }
            const data = await res.json();
            const d = data.data;
            // Auto-fill keywords field
            const tags = d.recommended_tags || [];
            if (tags.length > 0) {
                const kwEl = document.getElementById('keywords');
                if (kwEl) { kwEl.value = tags.join(', '); state.keywords = tags.join(', '); }
            }
            // Build results display
            let html = '<div style="background:var(--bg);border:1px solid var(--bg4);border-radius:8px;padding:14px;">';
            html += '<p style="font-size:13px;font-weight:600;color:var(--green);margin-bottom:10px;">Keywords auto-filled! Here\'s what YouTube users are searching for:</p>';
            if (d.autocomplete_suggestions?.length) {
                html += '<p style="font-size:12px;color:var(--pink);font-weight:600;margin-bottom:4px;">Top Autocomplete:</p>';
                html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;">';
                d.autocomplete_suggestions.slice(0,10).forEach(s => { html += `<span style="background:var(--bg3);padding:3px 8px;border-radius:4px;font-size:11px;color:var(--text2);cursor:pointer;" onclick="appendKeyword('${s.replace(/'/g,"\\'")}')">+ ${s}</span>`; });
                html += '</div>';
            }
            if (d.question_keywords?.length) {
                html += '<p style="font-size:12px;color:var(--pink);font-weight:600;margin-bottom:4px;">Question Keywords (great for titles):</p>';
                html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;">';
                d.question_keywords.slice(0,15).forEach(s => { html += `<span style="background:var(--bg3);padding:3px 8px;border-radius:4px;font-size:11px;color:var(--text2);cursor:pointer;" onclick="appendKeyword('${s.replace(/'/g,"\\'")}')">+ ${s}</span>`; });
                html += '</div>';
            }
            if (d.recommended_titles?.length) {
                html += '<p style="font-size:12px;color:var(--pink);font-weight:600;margin-bottom:4px;">Suggested Video Titles:</p>';
                d.recommended_titles.forEach(t => { html += `<p style="font-size:12px;color:var(--text);margin-left:8px;">• ${t}</p>`; });
            }
            html += '<p style="font-size:10px;color:var(--text2);margin-top:8px;">Click any keyword to add it to your list. ${d.long_tail_keywords?.length || 0} long-tail keywords found.</p>';
            html += '</div>';
            results.innerHTML = html;
            showToast(`Found ${tags.length} keywords + ${d.long_tail_keywords?.length || 0} long-tail terms!`);
        } catch (e) {
            results.innerHTML = `<p style="color:var(--red);font-size:13px;">Error: ${e.message}</p>`;
            showToast('Keyword research failed');
        } finally {
            btn.disabled = false; btn.textContent = '\ud83d\udd0d Research Keywords';
        }
    }

    async function postToSocial(schedule, dryRun) {
        const platform = document.getElementById('socialPlatform')?.value || 'instagram';

        const jobId = document.getElementById('socialJobId')?.value?.trim() || state.socialSelectedJobId || state.jobId;
        const hookType = document.getElementById('socialHook')?.value?.trim() || variant?.hook_type;

        const videoPath = document.getElementById('socialVideo')?.value?.trim();
        const caption = document.getElementById('socialCaption')?.value?.trim();
        const hashtagsRaw = document.getElementById('socialHashtags')?.value?.trim();
        const scheduleTime = document.getElementById('socialSchedule')?.value;
        const hashtags = hashtagsRaw ? hashtagsRaw.split(/[,\s]+/).filter(Boolean) : [];
        if (!jobId && !videoPath) { showToast('Select a completed job or enter a video path'); return; }
        const body = { platform, caption: caption || '', hashtags, dry_run: !!dryRun };
        if (jobId && hookType) {
            body.job_id = jobId;

            body.video_format = videoFormat;
            if (variant?.product_slug) body.product_slug = variant.product_slug;
        } else {

        }
        try {
            let endpoint = `${API}/social/post`;
            if (schedule && scheduleTime) {
                endpoint = `${API}/social/schedule`;
                body.scheduled_time = new Date(scheduleTime).toISOString();

                method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
            });

            if (res.ok) {
                showToast(dryRun ? 'Dry run successful!' : (schedule ? 'Post scheduled!' : 'Posted successfully!'));

    function parseAPFPreview(text) {
        try {
            const data = JSON.parse(text);
            if (!Array.isArray(data)) {
                showToast('JSON must be an array of products');
                return;
            }
            const products = data.map(item => ({
                product_name: item.product_name || '',
                niche: item.niche || 'General',
                key_features: Array.isArray(item.key_features) ? item.key_features : (item.key_features ? [item.key_features] : []),
                price: item.price || '$49.99',

    function parseCSVPreview(text) {
        const lines = text.split('\n').filter(l=>l.trim());
        if (lines.length < 2) { showToast('CSV needs a header row and at least one product row'); return; }
        const headers = lines[0].split(',').map(h=>h.trim().toLowerCase().replace(/\s+/g,'_').replace(/"/g,''));
        const products = [];
        for (let i=1; i<lines.length; i++) {
            const vals = parseCSVLine(lines[i]);
            if (!vals.length) continue;
            const row = {};
            headers.forEach((h,j)=> row[h] = (vals[j]||'').trim());
            if (!row.product_name) continue;
            products.push({
                product_name: row.product_name||'',
                niche: row.niche||'General',
                key_features: (row.key_features||'').split(',').map(s=>s.trim()).filter(Boolean),
                price: row.price||'$49.99',
                affiliate_link: row.affiliate_link||'[YOUR_AFFILIATE_LINK]',
                keywords: (row.keywords||'').split(',').map(s=>s.trim()).filter(Boolean),
                target_audience: row.target_audience||'General consumers',
                product_category: row.product_category||row.niche||'General',
                competitors: (row.competitors||'').split(',').map(s=>s.trim()).filter(Boolean),
                unique_selling_point: row.unique_selling_point||'',
                discount_info: row.discount_info||'',
                coupon_code: row.coupon_code||'',
                common_complaints: row.common_complaints||'',
                common_praises: row.common_praises||'',
                who_not_for: row.who_not_for||'',
                series_name: row.series_name||'',
                price_comparison: row.price_comparison||'',
                content_style: row.content_style||'honest_review',
            });
        }
        state.batchProducts = products;
        state.activeBatchIdx = 0;
        if (products.length && products[0].content_style) state.contentStyle = products[0].content_style;
        render();
        if (products.length) showToast(`Found ${products.length} products!`);
        else showToast('No valid products found. Check your CSV format.');
    }

    function parseCSVLine(line) {
        const result=[]; let current=''; let inQuotes=false;
        for(let i=0;i<line.length;i++){
            const c=line[i];
            if(c==='"'){inQuotes=!inQuotes;}
            else if(c===','&&!inQuotes){result.push(current);current='';}
            else{current+=c;}
        }
        result.push(current);
        return result;
    }

    async function pollStatus() {
        if (!state.jobId) return;
        try {
            const res=await fetch(`${API}/status/${state.jobId}`);
            const data=await res.json();
            if (!res.ok) {
                state.jobStatus='error';
                state.currentStep=(data&&data.detail)?String(data.detail):'Job not found (server may have restarted).';
                state.errors=[state.currentStep];
                const split = splitJobMessages(state.errors);
                state.scriptErrors=split.scriptErrors;
                state.videoWarnings=split.videoWarnings;
                state.otherErrors=split.otherErrors;
                state.progress=Number.isFinite(state.progress)?state.progress:0;
                state.page='error'; render(); return;
            }
            state.progress=Number.isFinite(data.progress)?data.progress:(state.progress||0);
            state.currentStep=data.current_step||state.currentStep||'';
            state.jobStatus=data.status; state.errors=data.errors||[];
            state.jobWarnings=data.warnings||[];
            if (data.audit) state.auditResult=data.audit;
            const split = splitJobMessages(state.errors);
            state.scriptErrors=data.script_errors || split.scriptErrors;
            state.videoWarnings=data.video_warnings || split.videoWarnings;
            state.otherErrors=data.other_errors || split.otherErrors;

            if (data.status==='complete' || data.status==='partial') {
                const rres=await fetch(`${API}/results/${state.jobId}`);
                const rdata=await rres.json();
                state.resultsSummary=rdata.summary||null;
                state.trustInputs=rdata.trust_inputs||null;
                state.jobWarnings=rdata.warnings||state.jobWarnings;
                if (rdata.audit) state.auditResult=rdata.audit;
                if (state.jobMode==='batch') {
                    state.batchResults=rdata.product_results||[];
                    state.activeProductIdx=0; state.activeTab=null;
                    state.selectedFormats=rdata.formats||state.selectedFormats;
                    state.resultsProductInfo=null;
                } else {
                    state.results=rdata.results;
                    state.resultsProductInfo=rdata.product_info||null;
                    state.activeTab=Object.keys(state.results||{})[0]||null;
                }
                state.activeFormat=state.selectedFormats[0];
                state.page='results'; render(); return;
            }
            if (data.status==='error') { state.page='error'; render(); return; }
            render(); setTimeout(pollStatus,2000);
        } catch(e) { setTimeout(pollStatus,3000); }
    }

    async function runJobAudit(refresh) {
        if (!state.jobId) {
            showToast('No job to audit.');
            return;
        }
        try {
            const url = `${API}/audit/${state.jobId}${refresh ? '?refresh=true' : ''}`;

            const data = await res.json();
            if (!res.ok) {
                showToast((data && data.detail) ? String(data.detail) : 'Audit failed.');
                return;
            }
            state.auditResult = data.audit || null;
            state.resultsSummary = data.summary || state.resultsSummary;
            render();
            const a = data.audit || {};
            showToast(`Audit: FAIL ${a.fail_count || 0}, WARN ${a.warn_count || 0}`);
        } catch (e) {
            showToast('Audit failed: ' + e.message);
        }
    }

    async function retryMissingOutputs() {
        if (!state.jobId) {
            showToast('No job to retry.');
            return;
        }
        try {
            const res = await fetch(`${API}/retry-missing/${state.jobId}`, { method: 'POST' });

            if (!res.ok) {
                showToast((data && data.detail) ? String(data.detail) : 'Retry failed.');

            state.errors = [];

            state.videoWarnings = [];
            state.otherErrors = [];
            render();
            pollStatus();
        } catch (e) {
            showToast('Retry failed: ' + e.message);
        }
    }
